name: Deploy GameV2 Canvas

on:
  push:
    branches: [master]
    paths:
      - 'gamev2/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy GameV2 to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner's OAuth token fetch to googleapis.com intermittently dies
      # with "Premature close" before the deploy starts (transient network
      # flake, ~daily). First attempt is allowed to fail; the retry step below
      # re-runs the identical deploy only when needed.
      - name: Deploy to Firebase
        id: deploy
        continue-on-error: true
        env:
          # googleapis token fetch dies with 'Premature close' on the runner's
          # IPv6 path — prefer IPv4 (this cured the dense flake on 2026-07-02)
          NODE_OPTIONS: --dns-result-order=ipv4first
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEVHOUSE_80936 }}
          channelId: live
          projectId: devhouse-80936
          target: devhouse-game-canvas
          # firebase-tools 15.22.4 ("latest") double-fires the release call after a
          # dropped connection and the retry 400s with "is the current active
          # version" — the deploy actually lands but the run goes red. 15.22.0 is
          # the last version this workflow ran green on.
          firebaseToolsVersion: 15.22.0

      - name: Retry deploy (transient auth flake)
        if: steps.deploy.outcome == 'failure'
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEVHOUSE_80936 }}
          channelId: live
          projectId: devhouse-80936
          target: devhouse-game-canvas
          firebaseToolsVersion: 15.22.0
