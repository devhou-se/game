name: Deploy GameV2 Canvas

on:
  push:
    branches: [master]
    paths:
      - 'gamev2/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy GameV2 to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # firebase-tools exit codes are unreliable (2026-07-02): 15.22.0 hard-
      # fails authenticating ('Premature close' fetching the OAuth token) and
      # 15.22.4 ('latest') authenticates fine but double-fires the release
      # call and exits non-zero AFTER the deploy has landed. So: deploy with
      # latest, allow failure, and let the VERIFY steps decide — the run is
      # green iff the live site actually serves the commit's index.html.
      - name: Deploy to Firebase
        id: deploy
        continue-on-error: true
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEVHOUSE_80936 }}
          channelId: live
          projectId: devhouse-80936
          target: devhouse-game-canvas

      - name: Verify live content
        id: verify
        continue-on-error: true
        run: |
          sleep 5
          curl -sf --max-time 20 https://game.devhou.se/index.html -o /tmp/live.html
          cmp /tmp/live.html gamev2/index.html

      - name: Retry deploy (only if the live site doesn't match)
        if: steps.verify.outcome == 'failure'
        continue-on-error: true
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEVHOUSE_80936 }}
          channelId: live
          projectId: devhouse-80936
          target: devhouse-game-canvas

      - name: Verify live content (authoritative)
        run: |
          sleep 5
          curl -sf --max-time 20 https://game.devhou.se/index.html -o /tmp/live.html
          cmp /tmp/live.html gamev2/index.html
          echo "live site matches the commit"
