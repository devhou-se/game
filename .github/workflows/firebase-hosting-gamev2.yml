name: Deploy GameV2 Canvas

on:
  push:
    branches: [master]
    paths:
      - 'gamev2/**'
      - 'firebase.json'
      - '.github/workflows/firebase-hosting-gamev2.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy GameV2 to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # What is published is dist/, not gamev2/ (firebase.json): the scripts as one file and the game's JSON
      # and images as three packs with content-hashed names. The built index.html carries the commit, so it
      # differs for every commit and the VERIFY steps below can tell which one the live site serves.
      - name: Build the published site
        working-directory: gamev2
        run: node tools/build_dist.js --commit "$GITHUB_SHA"

      # firebase-tools exit codes are unreliable (2026-07-02): 15.22.0 hard-
      # fails authenticating ('Premature close' fetching the OAuth token) and
      # 15.22.4 ('latest') authenticates fine but double-fires the release
      # call and exits non-zero AFTER the deploy has landed. So: deploy with
      # latest, allow failure, and let the VERIFY steps decide — the run is
      # green iff the live site actually serves the commit's built index.html.
      - name: Deploy to Firebase
        id: deploy
        continue-on-error: true
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEVHOUSE_80936 }}
          channelId: live
          projectId: devhouse-80936
          target: devhouse-game-canvas

      - name: Verify live content
        id: verify
        continue-on-error: true
        run: |
          sleep 5
          curl -sf --max-time 20 https://game.devhou.se/index.html -o /tmp/live.html
          cmp /tmp/live.html dist/index.html

      - name: Retry deploy (only if the live site doesn't match)
        if: steps.verify.outcome == 'failure'
        continue-on-error: true
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEVHOUSE_80936 }}
          channelId: live
          projectId: devhouse-80936
          target: devhouse-game-canvas

      - name: Verify live content (authoritative)
        run: |
          sleep 5
          curl -sf --max-time 20 https://game.devhou.se/index.html -o /tmp/live.html
          cmp /tmp/live.html dist/index.html
          echo "live site matches the commit"
          # the packs are cached for ever (firebase.json): fail if the header rule stopped matching them
          pack=$(grep -o 'pack/data\.[0-9a-f]*\.json' dist/index.html | head -n 1)
          test -n "$pack"
          curl -sfI --max-time 20 "https://game.devhou.se/$pack" | tee /tmp/pack-headers.txt
          grep -i '^cache-control:' /tmp/pack-headers.txt | grep -qi 'immutable'
          echo "the packs are served as immutable"
