name: Deploy Godot Game

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          curl -L -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          unzip -q templates.tpz -d /tmp/
          cp -r /tmp/templates/* ~/.local/share/godot/export_templates/4.7.stable/

      - name: Import & export Web build (GDScript, no Mono)
        run: |
          mkdir -p public
          godot --headless --import --path . || true
          godot --headless --path . --export-release "Web" ./public/index.html
          ls -la public/
          test -f public/index.html

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEVHOUSE_80936 }}
          channelId: live
          projectId: devhouse-80936
          target: devhouse-80936
