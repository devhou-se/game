name: "Godot CI/CD Export and Deploy"
on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  GODOT_VERSION: 3.6
  PROJECT_PATH: "."

jobs:
  export-web-and-deploy:
    name: Web Export and Firebase Deploy
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:mono-3.6
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Web Build
        run: |
          mkdir -v -p public
          godot --verbose --export "HTML5" ./public/index.html 
          
      - name: Install Node.js and npm
        run: |
          apt-get update
          apt-get install -y curl
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs
          node --version
          npm --version
        
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEVHOUSE_80936 }}'
          channelId: live
          projectId: devhouse-80936
          target: devhouse-80936
