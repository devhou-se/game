name: Deploy Godot Game

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  GODOT_VERSION: 3.6

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    container: barichello/godot-ci:mono-3.6
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Dependencies
        run: |
          apt-get update
          apt-get install -y wget curl
          
          # Install .NET SDK
          wget -q https://packages.microsoft.com/config/debian/10/packages-microsoft-prod.deb
          dpkg -i packages-microsoft-prod.deb
          apt-get update
          apt-get install -y dotnet-sdk-7.0
          
          # Install Node.js
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs

      - name: Build Project
        run: |
          mkdir -p public
          godot --headless --editor --quit
          dotnet build game.sln

      - name: Export Web Build
        run: |
          timeout 300 godot --headless --export "HTML5" ./public/index.html || echo "Export attempt completed"
          ls -la public/
          if [ ! -f "public/index.html" ]; then
            echo "Export failed - no index.html generated"
            exit 1
          fi
          
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEVHOUSE_80936 }}
          channelId: live
          projectId: devhouse-80936
