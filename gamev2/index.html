<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js" integrity="sha512-/tJYyDCrI7hnHWp45P189aOwPa6lTREosRhlxEIqx8skB4A3a3rD3iz4o335SJd4sORqjVHw5y1S2hq4hciwLw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <title>devhou.se game</title>
    <link rel="icon" href="data:,">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #000;
        }
        canvas {
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -webkit-font-smoothing: subpixel-antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body>
    <!-- Game scripts, loaded in order with a cache-buster so edits always apply -->
    <script>
        (function () {
            var v = Date.now();
            var files = [
                'src/utils/Constants.js',
                'src/systems/RoomManager.js',
                'src/systems/CollisionSystem.js',
                'src/systems/NPCManager.js',
                'src/systems/InputHandler.js',
                'src/systems/SpriteSystem.js',
                'src/Character.js',
                'src/DebugManager.js',
                'src/AchievementManager.js',
                'src/DialogueManager.js',
                'src/MenuManager.js',
                'src/GameScene.js',
                'src/game.js'
            ];
            files.forEach(function (f) {
                document.write('<script src="' + f + '?v=' + v + '"><\/script>');
            });
        })();
    </script>
</body>
</html>
