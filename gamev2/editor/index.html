<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Editor — devhou.se</title>
    <link rel="stylesheet" href="styles/editor2.css">
</head>
<body>
    <div id="app">
        <header id="topbar">
            <h1>World&nbsp;Editor</h1>
            <div class="spacer"></div>
            <button id="btn-fit" class="btn">Fit</button>
            <button id="btn-reload" class="btn">Reload config</button>
            <button id="btn-save" class="btn btn-primary">Save config.json</button>
        </header>

        <div id="body">
            <aside id="left">
                <div class="panel" id="room-panel"></div>
                <div class="panel">
                    <h3>Tool</h3>
                    <div id="toolbar-tools" class="tool-grid"></div>
                    <div class="hint">wheel = zoom · shift/middle-drag = pan</div>
                </div>
                <div class="panel" id="layer-panel"></div>
            </aside>

            <main id="center">
                <div id="canvas-wrap"><canvas id="canvas"></canvas></div>
                <div id="status">—</div>
            </main>

            <aside id="right">
                <div class="panel" id="inspector-panel"></div>
            </aside>
        </div>
    </div>

    <!-- Modules, cache-busted so edits always apply on reload -->
    <script>
        (function () {
            var v = Date.now();
            [
                'core/Depth.js',
                'core/Config.js',
                'core/Textures.js',
                'render/RoomCanvas.js',
                'panels/RoomPanel.js',
                'panels/LayerPanel.js',
                'panels/InspectorPanel.js',
                'app.js'
            ].forEach(function (f) { document.write('<script src="' + f + '?v=' + v + '"><\/script>'); });
        })();
    </script>
</body>
</html>
