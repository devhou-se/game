<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>studio (game.devhou.se)</title>
<link rel="icon" href="data:,">
<style>
@font-face { font-family: 'Pixel'; src: url('../fonts/PixelOperatorMono.ttf'); }
@font-face { font-family: 'Pixel'; src: url('../fonts/PixelOperatorMono-Bold.ttf'); font-weight: bold; }
@font-face { font-family: 'Press'; src: url('../fonts/PressStart2P-Regular.ttf'); }
/* Japanese (NPC lines, post titles): the game's pixel face, same ranges as src/utils/JapaneseFont.js */
@font-face { font-family: 'Pixel'; src: url('../fonts/PixelMplus12-Grid.ttf'); unicode-range: U+2E80-2FDF, U+3000-30FF, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF; }
@font-face { font-family: 'Pixel'; src: url('../fonts/PixelMplus12-Grid.ttf'); font-weight: bold; unicode-range: U+2E80-2FDF, U+3000-30FF, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF; }
@font-face { font-family: 'Press'; src: url('../fonts/PixelMplus12-Grid.ttf'); unicode-range: U+2E80-2FDF, U+3000-30FF, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF; }
:root {
    --paper: #f4efe4;
    --panel: #fbf8f1;
    --ink: #1b1f3b;
    --soft: #6d6f85;
    --line: #d9d1bf;
    --torii: #e0421f;
    --moat: #2f5fd0;
    --moss: #2f8f5b;
    --sun: #f2b01e;
    --space: 12px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 16px/1.25 'Pixel', monospace; overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
#app { display: grid; grid-template: auto 1fr / auto minmax(0, 1fr) 360px; height: 100%; }
header { grid-column: 1 / 4; flex-wrap: wrap; display: flex; align-items: center; gap: calc(var(--space) * 2); padding: var(--space) calc(var(--space) * 1.5); background: var(--ink); color: var(--paper); }
h1 { margin: 0; font: 14px 'Press', monospace; letter-spacing: 1px; color: var(--sun); }
.group { display: flex; align-items: center; gap: 6px; }
header button, header select { background: transparent; border: 2px solid #4a4f78; color: var(--paper); padding: 4px 10px; cursor: pointer; }
header button:hover, header select:hover { border-color: var(--paper); }
header button[aria-pressed="true"] { background: var(--paper); color: var(--ink); border-color: var(--paper); }
header .go, .actions .go { background: var(--sun); border-color: var(--sun); color: var(--ink); font-weight: bold; }
#edit, #source { margin-left: auto; }
#source + #edit { margin-left: 0; }
#source[hidden] + #edit { margin-left: auto; }
#stage { grid-area: 2 / 2; }
aside { grid-area: 2 / 3; }
nav { grid-area: 2 / 1; width: 280px; border-right: 2px solid var(--ink); background: var(--panel); overflow-y: auto; }
#search { width: 100%; padding: 4px 8px; border: 2px solid var(--ink); background: #fff; }
.asset { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; width: 100%; padding: 5px 6px; border: 0; background: none; text-align: left; cursor: pointer; }
.asset:hover { background: var(--line); }
.asset img { width: 44px; height: 44px; object-fit: contain; image-rendering: pixelated; }
.asset span span { display: block; }
.asset[aria-pressed="true"], .row[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.asset[aria-pressed="true"] .dim, .row[aria-pressed="true"] .dim { color: var(--line); }
.actions { display: flex; gap: 6px; margin: 6px 0 var(--space); }
.actions button { flex: 1; padding: 4px 8px; border: 2px solid var(--ink); background: #fff; cursor: pointer; }
.actions button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.actions button:disabled { border-color: var(--line); color: var(--soft); cursor: default; }
.actions .go:disabled { background: #fff; font-weight: normal; }
.change { display: grid; grid-template-columns: 20px 1fr; padding: 2px 0; }
.note { margin-top: 6px; color: var(--moss); overflow-wrap: anywhere; }
.note.bad { color: var(--torii); }
header select option { color: var(--ink); }
#date { min-width: 176px; text-align: center; font-weight: bold; font-size: 18px; }
#scrub { width: 170px; accent-color: var(--sun); }
#stage { position: relative; overflow: hidden; background: var(--paper); cursor: grab; }
#stage.dragging { cursor: grabbing; }
canvas { display: block; image-rendering: pixelated; }
aside { border-left: 2px solid var(--ink); background: var(--panel); overflow-y: auto; }
section { padding: calc(var(--space) * 1.5); border-bottom: 2px solid var(--line); }
h2 { margin: 0 0 var(--space); font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: baseline; }
.badge { background: var(--ink); color: var(--paper); padding: 0 8px; font-size: 14px; }
.badge.bad { background: var(--torii); }
.badge.good { background: var(--moss); }
.row { display: flex; justify-content: space-between; gap: var(--space); width: 100%; padding: 5px 6px; border: 0; background: none; text-align: left; cursor: pointer; }
.row:hover { background: var(--line); }
.row .dim { color: var(--soft); white-space: nowrap; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px var(--space); margin: 0 0 var(--space); }
.kv dt { color: var(--soft); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.tiles { margin: 0 0 var(--space); padding: 0; list-style: none; font-size: 14px; }
.tiles li { padding: 2px 0; overflow-wrap: anywhere; }
.tiles .solid { color: var(--torii); }
blockquote { margin: 0 0 8px; padding: 6px 10px; border-left: 4px solid var(--sun); background: #fff; }
.photo { display: block; width: 100%; image-rendering: pixelated; border: 2px solid var(--ink); margin-bottom: var(--space); }
code { display: block; padding: 8px 10px; background: var(--ink); color: var(--paper); font: 14px 'Pixel', monospace; cursor: copy; overflow-wrap: anywhere; }
.swatch { display: inline-block; width: 10px; height: 10px; margin-right: 6px; }
@media (max-width: 800px) {
    html, body { overflow: auto; }
    #app { grid-template: auto 60vh auto / minmax(0, 1fr); height: auto; }
    nav, #edit { display: none; }
    #stage, aside { grid-area: auto; }
    header { grid-column: 1; flex-wrap: wrap; gap: var(--space); }
    .group { flex-wrap: wrap; max-width: 100%; }
    #scrub { width: 100%; }
    #date { min-width: 0; }
    aside { border-left: 0; border-top: 2px solid var(--ink); }
}
#loading { position: absolute; inset: 0; display: grid; place-items: center; font: 12px 'Press', monospace; background: var(--paper); }
</style>
</head>
<body>
<div id="app">
    <header>
        <h1>studio</h1>
        <div class="group">
            <button id="prev">‹</button>
            <div id="date"></div>
            <button id="next">›</button>
            <input id="scrub" type="range" min="0" step="1">
        </div>
        <div class="group">
            <select id="as"></select>
        </div>
        <div class="group" id="layers"></div>
        <div class="group"><button id="stitch" hidden title="Tokyo as the one stitched city the game plays, or as the five rooms joined by seam teleports that ?stitch=0 plays">Stitched</button></div>
        <span class="badge" id="source" hidden></span>
        <button class="go" id="edit">Edit</button>
    </header>
    <nav id="rail" hidden>
        <section><div class="dim" id="where"></div><div class="actions" id="tools"></div><label class="dim" for="search">Library</label><input id="search" type="search"></section>
        <section id="library"></section>
    </nav>
    <div id="stage"><canvas id="view"></canvas><div id="loading">loading world</div></div>
    <aside>
        <section id="changes" hidden></section>
        <section id="inspector" hidden></section>
        <section><h2>Problems <span class="badge" id="problem-count"></span></h2><div id="problems"></div></section>
        <section><h2>Rooms</h2><div id="rooms"></div></section>
    </aside>
</div>
<script>
    for (const f of ['../src/utils/ConfigCodec.js', '../src/utils/Trips.js', '../src/utils/NpcStates.js', '../src/utils/Interactions.js',
        '../src/systems/TiledAdapter.js', '../src/systems/RoomManager.js', '../src/systems/CollisionSystem.js',
        '../src/systems/CityStitcher.js', '../src/Shop.js', '../src/TrainTravel.js', '../tools/world-model.js', 'edit.js', 'studio.js']) {
        document.write('<script src="' + f + '?v=' + Date.now() + '"><\/script>');
    }
</script>
</body>
</html>
